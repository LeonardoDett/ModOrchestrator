name: ci

on:
  push:
  pull_request:

# PR code from forks runs here without secrets. Signing never happens in this
# workflow (D077): never switch it to pull_request_target.
permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l internal main.go)"
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The frontend consumes the local dettmann-ui build (file: dependency).
      - name: dettmann-ui build
        working-directory: dettmann-ui-vnext
        run: |
          npm ci
          npm run build
      - name: frontend install
        run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
